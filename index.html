<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khalil Fuller — LinkedIn</title>

<!-- Fallback for when JS is unavailable. Fires immediately. -->
<meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/khalilfuller/">

<link rel="canonical" href="https://www.linkedin.com/in/khalilfuller/">
<meta name="robots" content="noindex">

<!-- Social preview, so the link unfurls nicely in Slack/iMessage/etc. -->
<meta property="og:title" content="Khalil Fuller">
<meta property="og:description" content="Always working. Redirecting to LinkedIn.">
<meta property="og:url" content="https://www.linkedin.com/in/khalilfuller/">

<!-- Redirect as early as possible: replace() avoids a back-button trap. -->
<script>
  window.location.replace("https://www.linkedin.com/in/khalilfuller/");
</script>

<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --accent: #0a66c2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #f2f2f0; --muted: #9a9a94; --accent: #70b5f9; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; max-width: 30rem; }
  h1 {
    margin: 0 0 .4rem;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  .dots::after {
    content: "";
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }
  a {
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
  }
  a:hover { opacity: .75; }
  @media (prefers-reduced-motion: reduce) {
    .dots::after { animation: none; content: "..."; }
  }
</style>
</head>
<body>
  <main>
    <h1>Always working<span class="dots"></span></h1>
    <p>Taking you to Khalil&rsquo;s LinkedIn.</p>
    <a href="https://www.linkedin.com/in/khalilfuller/">Go there now &rarr;</a>
  </main>
</body>
</html>
